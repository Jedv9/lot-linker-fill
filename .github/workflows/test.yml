name: Tests

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Unit + e2e tests
        run: npm test
