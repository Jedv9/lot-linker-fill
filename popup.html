<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light; }
    body { font: 13px/1.35 system-ui, sans-serif; margin: 0; width: 360px; background: #0f172a; color: #e2e8f0; }
    header { padding: 12px 14px 8px; border-bottom: 1px solid #1e293b; }
    h1 { font-size: 14px; margin: 0 0 4px; font-weight: 650; }
    .sub { color: #94a3b8; font-size: 11px; }
    .wrap { padding: 10px 14px 14px; display: grid; gap: 8px; }
    input, textarea, select { width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid #334155; background: #111827; color: #e2e8f0; padding: 8px 10px; }
    input:focus, textarea:focus { outline: 2px solid #0ea5e9; border-color: transparent; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; }
    button { border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; font-weight: 600; background: #0ea5e9; color: #04111a; }
    button.secondary { background: #1e293b; color: #e2e8f0; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .card { background: #111827; border: 1px solid #1e293b; border-radius: 10px; padding: 10px; }
    .meta { display: grid; grid-template-columns: 72px 1fr; gap: 4px 8px; font-size: 12px; }
    .meta b { color: #94a3b8; font-weight: 500; }
    .body { max-height: 90px; overflow: auto; white-space: pre-wrap; font-size: 11px; color: #cbd5e1; }
    .status { font-size: 11px; color: #93c5fd; min-height: 14px; }
    .warn { color: #fbbf24; font-size: 11px; }
    details { font-size: 12px; }
    summary { cursor: pointer; color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <h1>Lot Linker Fill</h1>
    <div class="sub">Fill only · you always hit Post · WI / Boucher packs</div>
  </header>
  <div class="wrap">
    <input id="q" type="search" placeholder="Search stock / VIN / model…" autocomplete="off" />
    <select id="list" size="6"></select>
    <div id="card" class="card" hidden>
      <div class="meta">
        <b>Stock</b><span id="mStock"></span>
        <b>Title</b><span id="mTitle"></span>
        <b>Price</b><span id="mPrice"></span>
        <b>VIN</b><span id="mVin"></span>
        <b>Miles</b><span id="mMiles"></span>
        <b>Cond</b><span id="mCond"></span>
        <b>Ext</b><span id="mExt"></span>
        <b>Int</b><span id="mInt"></span>
      </div>
      <div class="body" id="mBody" style="margin-top:8px"></div>
    </div>
    <div class="row">
      <button id="fill" disabled>Fill Marketplace form</button>
      <button class="secondary" id="copyTitle" disabled>Copy title</button>
      <button class="secondary" id="copyBody" disabled>Copy body</button>
      <button class="secondary" id="copyPrice" disabled>Copy price</button>
      <button class="secondary" id="downloadPhotos" disabled>Download photos</button>
    </div>
    <div class="sub" id="photoMeta" style="color:#94a3b8;font-size:11px"></div>
    <div class="status" id="status"></div>
    <div class="row">
      <button class="secondary" id="refreshInventory">Refresh inventory</button>
    </div>
    <div class="sub" id="refreshMeta"></div>
    <p class="warn">Open Facebook Marketplace → Vehicle for sale (store account), pick a stock, Fill, then you click Post.</p>
    <details>
      <summary>Import ALL-EASY-PASTE / packs.json</summary>
      <textarea id="importText" rows="4" placeholder="Paste ALL-EASY-PASTE.md text here…"></textarea>
      <div class="row" style="margin-top:6px">
        <button class="secondary" id="importPaste">Import paste</button>
        <label class="secondary" style="display:inline-flex;align-items:center;gap:6px;background:#1e293b;padding:8px 10px;border-radius:8px;cursor:pointer">
          Load JSON<input id="importFile" type="file" accept="application/json,.json" hidden />
        </label>
      </div>
    </details>
  </div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
