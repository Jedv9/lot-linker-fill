<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light; }
    body { font: 13px/1.35 system-ui, sans-serif; margin: 0; width: 400px; background: #0f172a; color: #e2e8f0; }
    header { padding: 12px 14px 8px; border-bottom: 1px solid #1e293b; }
    h1 { font-size: 14px; margin: 0 0 4px; font-weight: 650; }
    .sub { color: #94a3b8; font-size: 11px; }
    .wrap { padding: 10px 14px 14px; display: grid; gap: 8px; }
    input, select { width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid #334155; background: #111827; color: #e2e8f0; padding: 8px 10px; }
    input:focus, select:focus { outline: 2px solid #0ea5e9; border-color: transparent; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; }
    button { border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; font-weight: 600; background: #0ea5e9; color: #04111a; }
    button.secondary { background: #1e293b; color: #e2e8f0; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .card { background: #111827; border: 1px solid #1e293b; border-radius: 10px; padding: 10px; }
    .title { font-weight: 650; font-size: 12px; color: #f8fafc; }
    .body { max-height: 180px; overflow: auto; white-space: pre-wrap; font-size: 11px; color: #cbd5e1; margin-top: 8px; }
    .status { font-size: 11px; color: #93c5fd; min-height: 14px; }
    .warn { color: #fbbf24; font-size: 11px; margin: 0; }
  </style>
</head>
<body>
  <header>
    <h1>Lot Linker Fill</h1>
    <div class="sub">Model + description only · you always hit Post</div>
  </header>
  <div class="wrap">
    <input id="q" type="search" placeholder="Search stock / VIN / model…" autocomplete="off" />
    <select id="fStore" title="Store">
      <option value="">All stores</option>
    </select>
    <select id="list" size="7"></select>
    <div id="card" class="card" hidden>
      <div class="title" id="mTitle"></div>
      <div class="body" id="mBody"></div>
    </div>
    <div class="row">
      <button id="fill" disabled>Fill model + description</button>
      <button class="secondary" id="refreshInventory">Refresh packs</button>
    </div>
    <div class="sub" id="refreshMeta"></div>
    <div class="status" id="status"></div>
    <p class="warn">Open Marketplace → create listing, pick a stock, Fill, then you click Post.</p>
  </div>
  <script src="config.js"></script>
  <script src="listing-copy.js"></script>
  <script src="popup.js"></script>
</body>
</html>
