<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Lot Linker posted-tracker fixture</title>
  <style>
    :root { color-scheme: light; }
    body { font: 13px/1.35 system-ui, sans-serif; margin: 0; width: 460px; background: #0f172a; color: #e2e8f0; }
    header { padding: 12px 14px 8px; border-bottom: 1px solid #1e293b; }
    h1 { font-size: 14px; margin: 0 0 4px; font-weight: 650; }
    .sub { color: #94a3b8; font-size: 11px; }
    .wrap { padding: 10px 14px 14px; display: grid; gap: 8px; }
    input, select { width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid #334155; background: #111827; color: #e2e8f0; padding: 8px 10px; }
    .filters { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; }
    .left { font-size: 12px; font-weight: 650; color: #7dd3fc; white-space: nowrap; padding-right: 2px; }
    #list { max-height: 196px; overflow: auto; border: 1px solid #334155; border-radius: 8px; background: #111827; }
    .item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; cursor: pointer; border-bottom: 1px solid #1e293b; }
    .item:last-child { border-bottom: 0; }
    .item.sel { background: #0c4a6e; }
    .item .lab { flex: 1; min-width: 0; font-size: 11px; line-height: 1.35; }
    .item .mark { flex: none; border: 0; border-radius: 8px; padding: 4px 8px; cursor: pointer; font-size: 10px; font-weight: 650; background: #334155; color: #e2e8f0; }
    .item .mark.posted { background: #14532d; color: #86efac; }
    input:focus, select:focus { outline: 2px solid #0ea5e9; border-color: transparent; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; }
    button { border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; font-weight: 600; background: #0ea5e9; color: #04111a; }
    button.secondary { background: #1e293b; color: #e2e8f0; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .card { background: #111827; border: 1px solid #1e293b; border-radius: 10px; padding: 10px; }
    .pick { font-size: 11px; color: #7dd3fc; margin-bottom: 6px; }
    .title { font-weight: 650; font-size: 12px; color: #f8fafc; }
    .body { max-height: 180px; overflow: auto; white-space: pre-wrap; font-size: 11px; color: #cbd5e1; margin-top: 8px; }
    .status { font-size: 11px; color: #93c5fd; min-height: 14px; }
    .warn { color: #fbbf24; font-size: 11px; margin: 0; }
  </style>
</head>
<body>
  <header>
    <h1>Lot Linker Fill</h1>
    <div class="sub">Posted-tracker fixture · real proof packs only</div>
  </header>
  <div class="wrap">
    <input id="q" type="search" placeholder="Search stock / VIN / model…" autocomplete="off" />
    <select id="fStore" title="Store">
      <option value="">All stores</option>
    </select>
    <div class="filters">
      <select id="fPosted" title="Posted filter">
        <option value="not" selected>Not posted</option>
        <option value="posted">Posted</option>
        <option value="all">All</option>
      </select>
      <div class="left" id="leftCount">0 left</div>
    </div>
    <div id="list" role="listbox" aria-label="Inventory"></div>
    <div id="card" class="card" hidden>
      <div class="pick" id="mPick"></div>
      <div class="sub" id="mPosted"></div>
      <div class="title" id="mTitle"></div>
      <div class="sub" id="mPhotos"></div>
      <div class="body" id="mBody"></div>
    </div>
    <div class="row">
      <button id="fill" disabled>Fill</button>
      <button class="secondary" id="togglePosted" disabled>Mark posted</button>
      <button class="secondary" id="savePhotos" disabled>Save photos (fallback)</button>
      <button class="secondary" id="refreshInventory">Refresh packs</button>
    </div>
    <div class="sub" id="refreshMeta"></div>
    <div class="status" id="status"></div>
  </div>
  <script>
    const FIXTURE_PACKS = {
      generated: "fixture",
      packs: [
        {"stock":"26NU0143","year":"2026","make":"Nissan","model":"Altima","trim":"2.5 SR","bodyStyle":"Sedan 4D","mileage":"0","vin":"1N4BL4CW4TN327585","condition":"NEW","exterior":"Gray Sky Pearl","interior":"Sport","fuel":"Gasoline","drivetrain":"AWD","price":"30470","rooftop":"Lake Country Nissan","vdpUrl":"https://www.nissanlakecountry.com/inventory/new-2026-nissan-altima-2-5-sr-awd-4d-sedan-1n4bl4cw4tn327585/","photoUrls":[]},
        {"stock":"26NU0156","year":"2026","make":"Nissan","model":"Altima","trim":"2.5 SV","bodyStyle":"Sedan 4D","mileage":"6","vin":"1N4BL4DV8TN337381","condition":"NEW","exterior":"Pearl White Tricoat","interior":"Charcoal","fuel":"Gasoline","drivetrain":"FWD","price":"28320","rooftop":"Lake Country Nissan","vdpUrl":"https://www.nissanlakecountry.com/inventory/new-2026-nissan-altima-2-5-sv-fwd-4d-sedan-1n4bl4dv8tn337381/","photoUrls":[]}
      ]
    };
    const mem = { postedByStock: {} };
    const listeners = [];
    window.chrome = {
      runtime: {
        id: "fixture",
        getURL(path) { return "fixture://" + path; },
        sendMessage() {},
      },
      storage: {
        local: {
          get(keys, cb) {
            const out = {};
            const list = Array.isArray(keys) ? keys : keys ? Object.keys(keys) : Object.keys(mem);
            if (typeof keys === "string") out[keys] = mem[keys];
            else for (const k of list) out[k] = mem[k];
            if (cb) cb(out);
            return Promise.resolve(out);
          },
          set(obj, cb) {
            const changes = {};
            for (const [k, v] of Object.entries(obj)) {
              changes[k] = { oldValue: mem[k], newValue: v };
              mem[k] = v;
            }
            for (const fn of listeners) fn(changes, "local");
            if (cb) cb();
            return Promise.resolve();
          },
          remove(keys, cb) {
            const list = Array.isArray(keys) ? keys : [keys];
            for (const k of list) delete mem[k];
            if (cb) cb();
            return Promise.resolve();
          },
        },
        onChanged: { addListener(fn) { listeners.push(fn); } },
      },
      tabs: { query: async () => [] },
      downloads: { download: async () => 1 },
    };
    window.fetch = async (url) => {
      if (String(url).includes("packs")) {
        return { ok: true, json: async () => FIXTURE_PACKS };
      }
      throw new Error("unexpected fetch " + url);
    };
    window.__lotLinkerMem = mem;
  </script>
  <script src="../config.js"></script>
  <script src="../listing-copy.js"></script>
  <script src="../photos.js"></script>
  <script src="../posted.js"></script>
  <script src="../popup.js"></script>
  <script>
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    function left() { return document.getElementById("leftCount")?.textContent || ""; }
    function marks() { return [...document.querySelectorAll("#list .mark")].map((b) => b.textContent); }
    function stocks() {
      return [...document.querySelectorAll("#list .item")].map((el) => el.dataset.stock);
    }

    async function run() {
      const report = { ok: false };
      try {
        await wait(200);
        report.defaultFilter = document.getElementById("fPosted").value;
        report.initialLeft = left();
        report.initialMarks = marks();
        report.initialStocks = stocks();
        if (report.defaultFilter !== "not") throw new Error("filter must default to not posted");
        if (report.initialLeft !== "2 left") throw new Error("expected 2 left, got " + report.initialLeft);
        if (report.initialMarks.join() !== "Not posted,Not posted") throw new Error("default rows must be not posted");
        if (report.initialStocks.join() !== "26NU0143,26NU0156") throw new Error("must use proof packs, not invented inventory");

        document.querySelector('#list .item[data-stock="26NU0143"] .mark').click();
        await wait(80);
        report.afterMarkLeft = left();
        report.afterMarkStocks = stocks();
        report.storedAfterMark = Object.keys(window.__lotLinkerMem.postedByStock || {});
        if (report.afterMarkLeft !== "1 left") throw new Error("count should drop to 1 left");
        if (report.afterMarkStocks.join() !== "26NU0156") throw new Error("posted stock should leave Not posted filter");
        if (report.storedAfterMark.join() !== "26NU0143") throw new Error("mark must persist by stock");

        const filter = document.getElementById("fPosted");
        filter.value = "posted";
        filter.dispatchEvent(new Event("change"));
        await wait(40);
        report.postedStocks = stocks();
        report.postedMarks = marks();
        if (report.postedStocks.join() !== "26NU0143" || report.postedMarks.join() !== "Posted") {
          throw new Error("Posted filter should show only 26NU0143");
        }

        filter.value = "all";
        filter.dispatchEvent(new Event("change"));
        await wait(40);
        report.allStocks = stocks();
        report.allMarks = marks();
        if (report.allStocks.join() !== "26NU0143,26NU0156") throw new Error("All filter should keep both proof packs");
        if (!report.allMarks.includes("Posted") || !report.allMarks.includes("Not posted")) {
          throw new Error("All filter should show both states");
        }

        const q = document.getElementById("q");
        q.value = "0156";
        q.dispatchEvent(new Event("input"));
        await wait(40);
        report.searchStocks = stocks();
        report.searchLeft = left();
        if (report.searchStocks.join() !== "26NU0156") throw new Error("search must still work with posted filter");
        if (report.searchLeft !== "1 left") throw new Error("left count should follow search+store, not posted filter");

        q.value = "";
        q.dispatchEvent(new Event("input"));
        await wait(40);

        const markedBeforeRefresh = JSON.stringify(window.__lotLinkerMem.postedByStock);
        document.getElementById("refreshInventory").click();
        await wait(200);
        report.refreshKeptMarks = JSON.stringify(window.__lotLinkerMem.postedByStock) === markedBeforeRefresh;
        if (!report.refreshKeptMarks) throw new Error("Refresh packs wiped posted marks");
        report.afterRefreshLeft = left();

        filter.value = "posted";
        filter.dispatchEvent(new Event("change"));
        await wait(40);
        document.querySelector('#list .item[data-stock="26NU0143"]')?.click();
        await wait(40);
        document.getElementById("togglePosted").click();
        await wait(80);
        filter.value = "not";
        filter.dispatchEvent(new Event("change"));
        await wait(40);
        report.afterUnmarkLeft = left();
        report.afterUnmarkStocks = stocks();
        if (report.afterUnmarkLeft !== "2 left") throw new Error("unmark should return stock to not posted");
        if (report.afterUnmarkStocks.join() !== "26NU0143,26NU0156") throw new Error("both packs should be not posted after unmark");

        report.searchStillThere = Boolean(document.getElementById("q"));
        report.storeStillThere = Boolean(document.getElementById("fStore"));
        report.fillStillThere = Boolean(document.getElementById("fill"));
        report.ok = true;
      } catch (e) {
        report.error = String(e?.message || e);
      }
      document.documentElement.dataset.report = JSON.stringify(report);
      document.body.dataset.report = JSON.stringify(report);
      document.body.dataset.reportReady = "1";
    }
    run();
  </script>
</body>
</html>
