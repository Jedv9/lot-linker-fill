<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Lot Linker fill fixture</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; max-width: 760px; margin: 24px auto; color: #0f172a; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    input, textarea, [contenteditable] { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; }
    [contenteditable] { min-height: 220px; border: 1px solid #94a3b8; white-space: pre-wrap; }
    .row { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
    button { padding: 8px 12px; font-weight: 600; }
    #status { color: #0369a1; min-height: 1.2em; }
    .warn { color: #b45309; }
    .fb-field { margin: 12px 0; }
    .fb-field > span { display: block; font-weight: 600; margin-bottom: 4px; }
  </style>
</head>
<body>
  <h1>Marketplace vehicle create listing (fixture)</h1>
  <p class="warn">Uses the real content-script fill. Only Model and Description should change. Year, Make, and Mileage must stay put.</p>
  <div class="row">
    <button id="fillRaptor" type="button">Fill Ford PU1392</button>
    <button id="fillNissan" type="button">Fill Nissan 26NU0143</button>
  </div>
  <div id="status"></div>

  <div class="fb-field">
    <span>Year</span>
    <input id="year" aria-label="Year" value="2012" />
  </div>
  <div class="fb-field">
    <span>Make</span>
    <input id="make" aria-label="Make" value="Ford" />
  </div>
  <div class="fb-field">
    <label>
      <span>Model</span>
      <input id="model" />
    </label>
  </div>
  <div class="fb-field">
    <span>Mileage</span>
    <input id="mileage" aria-label="Mileage" value="87000" />
  </div>
  <div class="fb-field">
    <span id="desc-lab">Description</span>
    <div id="description" role="textbox" aria-labelledby="desc-lab" aria-label="Description" contenteditable="true" aria-multiline="true"></div>
  </div>

  <script src="../listing-copy.js?v=model-line"></script>
  <script src="../content-fb.js"></script>
  <script>
    function snapshot() {
      return {
        year: document.getElementById("year").value,
        make: document.getElementById("make").value,
        model: document.getElementById("model").value,
        mileage: document.getElementById("mileage").value,
        description: document.getElementById("description").innerText || document.getElementById("description").textContent,
      };
    }

    function resetForm(year, make, mileage) {
      document.getElementById("year").value = year;
      document.getElementById("make").value = make;
      document.getElementById("model").value = "";
      document.getElementById("mileage").value = mileage;
      document.getElementById("description").innerHTML = "";
      document.getElementById("description").textContent = "";
    }

    function runFill(pack, label, preset) {
      resetForm(preset.year, preset.make, preset.mileage);
      const result = LotLinkerFill.fillPack(pack);
      const fields = snapshot();
      const listing = LotLinkerListing.packToListing(pack);
      const protectedOk =
        fields.year === preset.year &&
        fields.make === preset.make &&
        fields.mileage === preset.mileage;
      const modelOk = fields.model === listing.modelLine && !/^20\d{2}\b/.test(fields.model) && !/Ford|Nissan|Hyundai/i.test(fields.model.split(" | ")[0] || "");
      const descOk = fields.description.includes("Wisconsin shoppers") && /\n/.test(fields.description);
      const keysOk = result.filled.includes("model") && result.filled.includes("description") && !result.missed.length;
      const ok = protectedOk && modelOk && descOk && keysOk;
      document.getElementById("status").textContent =
        `${label}: filled ${result.filled.join(", ") || "none"} · missed ${result.missed.join(", ") || "none"} · ${ok ? "PASS" : "FAIL"}`;
      return { label, ok, result, fields, listing };
    }

    const raptor = {"stock":"PU1392","year":"2012","make":"Ford","model":"F-150","trim":"SVT Raptor","bodyStyle":"Crew Cab 4D","mileage":"87000","condition":"USED","drivetrain":"4WD","price":"26900","rooftop":"Lake Country Nissan","body":"USED 2012 Ford F-150 SVT Raptor · 4WD. Located at Lake Country Nissan. Stock PU1392, 87,000 miles. Standouts: Heated Seats · Backup Camera · 4WD."};
    const nissan = {"stock":"26NU0143","year":"2026","make":"Nissan","model":"Altima","trim":"2.5 SR","bodyStyle":"Sedan 4D","mileage":"0","condition":"NEW","drivetrain":"AWD","price":"30470","rooftop":"Lake Country Nissan","body":"NEW 2026 Nissan Altima 2.5 SR · AWD. Located at Lake Country Nissan, N48W36216 E Wisconsin Ave, Oconomowoc. Stock 26NU0143. Standouts: Blind Spot Monitor · Lane Departure Warning · Parking Sensors / Assist · Forward Collision Warning · Bluetooth · Power Blue Seats. Also: Android Auto, Apple CarPlay, leatherette seats, Satellite Radio Ready. Price does not include tax, title, registration, and service fees. Call (262) 522-7200 and ask for Jed."};
    document.getElementById("fillRaptor").onclick = () => runFill(raptor, "Raptor", { year: "2012", make: "Ford", mileage: "87000" });
    document.getElementById("fillNissan").onclick = () => runFill(nissan, "Nissan", { year: "2026", make: "Nissan", mileage: "0" });
    const want = new URLSearchParams(location.search).get("pack");
    const report = want === "nissan"
      ? [runFill(nissan, "Nissan", { year: "2026", make: "Nissan", mileage: "0" })]
      : want === "raptor"
        ? [runFill(raptor, "Raptor", { year: "2012", make: "Ford", mileage: "87000" })]
        : [
            runFill(raptor, "Raptor", { year: "2012", make: "Ford", mileage: "87000" }),
            runFill(nissan, "Nissan", { year: "2026", make: "Nissan", mileage: "0" }),
          ];
    window.__lotLinkerReport = report;
    document.body.dataset.report = JSON.stringify(report.map((r) => ({
      label: r.label,
      ok: r.ok,
      filled: r.result.filled,
      missed: r.result.missed,
      model: r.fields.model,
      modelLine: r.listing.modelLine,
      year: r.fields.year,
      make: r.fields.make,
      mileage: r.fields.mileage,
      descriptionHasNewlines: /\n/.test(r.fields.description),
    })));
  </script>
</body>
</html>
